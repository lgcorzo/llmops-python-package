---
name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Check OPENROUTER_API_KEY secret
        id: check_key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY is not configured or empty." \
              "Skipping OpenWiki update."
            echo "### ⚠️ OpenWiki Update Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "OPENROUTER_API_KEY is required for non-interactive" \
              "OpenWiki runs." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure OPENROUTER_API_KEY in Repository Settings ->" \
              "Secrets and variables -> Actions to enable automated updates." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.check_key.outputs.has_key == 'true' }}
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"

      - name: Install OpenWiki
        if: ${{ steps.check_key.outputs.has_key == 'true' }}
        run: npm install --global openwiki

      - name: Run OpenWiki
        if: ${{ steps.check_key.outputs.has_key == 'true' }}
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Create OpenWiki update pull request
        if: ${{ steps.check_key.outputs.has_key == 'true' }}
        # yamllint disable-line rule:line-length
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
